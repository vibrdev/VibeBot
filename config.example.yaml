# Copy to config.yaml and edit. Every value can also be set with an env var:
#   VIBEBOT_<SECTION>_<FIELD>   e.g. VIBEBOT_POLICY_AUTONOMY=yolo
# Defaults are 100% local and 100% free.

browser:
  headless: false          # forced on automatically when there is no display
  width: 1440
  height: 900
  user_data_dir: ./.vibebot/profile   # logins persist here between runs
  start_url: about:blank
  locale: en-US
  max_frames: 12           # main document + iframes scanned per page
  follow_new_tabs: true    # jump to tabs the page opens, like a person would
  screenshot_max_width: 1024  # downscale before the model sees it (0 = full size).
                           # Measured on qwen3.5:4b, same page: 1440px = 1280 image
                           # tokens, 1024px = 660, 768px = 380. At 1440 the picture
                           # alone outweighs llm.max_tokens. Does NOT change memory.

decider:
  backend: laya            # laya | jev | heuristic
  model: auto              # auto = Laya's Router; or convaiinnovations/laya[-multilingual]
  device: cpu              # cuda if you have a GPU
  preload: false           # true loads Laya's multilingual weights too (~2.5 GB of
                           # commit) for models an English run never touches
  min_headroom_mb: 3000    # skip Laya below this much *grantable* memory. Torch
                           # dies rather than raises when the OS declines a commit
                           # charge, so this trades a segfault for a warning.
  max_candidates: 12       # elements Laya chooses between (its context is small)
  page_text_chars: 200     # page text sent to Laya: ~3.7s/step fixed + ~3.4s per 1000 chars.
  accept_probability: 0.55 # p(top option) needed to act without the LLM
  accept_margin: 0.15      # …and how far ahead of the runner-up it must be
  done_confidence: 0.80    # "goal achieved" threshold (LLM double-checks)
  risk_threshold: 0.60     # P(consequential) above which you get asked. Only
                           # applies to actions Back cannot undo: following a
                           # link or typing in a search box never asks on this
                           # score alone (measured, it reads 1.00 for eBay's
                           # "Deals" link). policy.risky_keywords still does.
  # Paid alternative, off by default:
  # backend: jev
  # jev_base_url: https://api.example.com
  # jev_api_key_env: JEV_API_KEY

llm:
  backend: ollama          # ollama | openai | none. An unknown value is a
                           # startup error, not a silent fall back to ollama.
  model: qwen3.5:4b        # ollama pull qwen3.5:4b (3.4 GB, vision included)
                           # more VRAM -> qwen3.5:9b, less -> :2b or :0.8b
  think: off               # off | on | auto. Thinking is on by default in
                           # Ollama and hides the answer in message.thinking.
  base_url: ""             # empty = this backend's own default
                           # (ollama -> http://127.0.0.1:11434,
                           #  openai -> https://api.openai.com).
                           # Leave it empty unless you are pointing somewhere
                           # else: a base_url left over from the other backend
                           # is the classic "why is it calling localhost" bug.
  vision: true             # send annotated screenshots (needs a vision model)
  temperature: 0.1
  timeout_s: 180
  max_tokens: 1024
  keep_alive: 5m           # how long Ollama keeps the model resident between calls.
                           # It holds ~5.7 GB of commit while loaded; VibeBot always
                           # releases it when a run ends. "30s" or "0" frees it sooner
                           # at the cost of a reload.
  # Paid alternative (also works for OpenRouter / LM Studio / vLLM / Groq):
  # backend: openai
  # model: gpt-4o-mini
  # base_url: ""           # or https://openrouter.ai/api, http://127.0.0.1:1234, ...
  # api_key_env: OPENAI_API_KEY

policy:
  autonomy: normal         # guided (confirm everything) | normal | yolo
  max_steps: 40
  max_llm_calls: 25
  stall_limit: 3
  allow_domains: []        # e.g. [google.com, wikipedia.org] — empty = anywhere
  block_domains: []
  never_type_into_password: true
  user_reply_timeout_s: 900

server:
  host: 127.0.0.1
  port: 8765
  token: ""                # REQUIRED if you bind to 0.0.0.0 on a server
  live_fps: 2.0            # optional live view; only runs while you watch
  open_browser: true       # open the UI when the server is ready, so starting
                           # VibeBot is one double-click and no copied URLs
  pid_file: ./.vibebot/server.pid   # how "Stop VibeBot" finds the running server

trace_dir: ./.vibebot/traces
