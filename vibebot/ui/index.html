<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VibeBot</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a32; --text: #e6edf3;
    --muted: #8b98a5; --laya: #34d399; --llm: #a78bfa; --user: #fbbf24;
    --bad: #f87171; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; gap: 10px; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header b { letter-spacing: .5px; }
  #goal {
    flex: 1; background: #0b0d10; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font: inherit;
  }
  #goal:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #04121a; border: 0; border-radius: 8px;
    padding: 9px 16px; font: 600 14px/1 inherit; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  #stage { position: relative; background: #05070a; display: grid; place-items: center; overflow: hidden; }
  #stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #stage .empty { color: var(--muted); font-size: 13px; }
  aside { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #meta { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #meta .pill {
    display: inline-block; padding: 1px 7px; border-radius: 99px; margin-right: 6px;
    border: 1px solid var(--line); color: var(--text);
  }
  #feed { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 13px; }
  .row { padding: 6px 0; border-bottom: 1px solid #1a2028; display: flex; gap: 8px; }
  .row .tag {
    flex: 0 0 auto; font: 600 10px/16px ui-monospace, monospace; text-transform: uppercase;
    padding: 0 6px; border-radius: 4px; background: #1b232c; color: var(--muted);
    height: 16px; margin-top: 2px;
  }
  .laya .tag { color: var(--laya); }
  .llm .tag { color: var(--llm); }
  .user .tag { color: var(--user); }
  .bad .tag { color: var(--bad); }
  .row .body { flex: 1; word-break: break-word; }
  .row .sub { color: var(--muted); font-size: 12px; }
  .bar { height: 3px; background: #1b232c; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--laya); }
  #ask { border-top: 1px solid var(--line); padding: 12px 14px; background: #171b21; display: none; }
  #ask.show { display: block; }
  #ask p { margin: 0 0 8px; white-space: pre-wrap; }
  #ask .inline { display: flex; gap: 8px; }
  #answer { flex: 1; background: #0b0d10; border: 1px solid var(--line); color: var(--text);
            border-radius: 8px; padding: 8px 10px; font: inherit; }
  footer { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <b>VibeBot</b>
  <input id="goal" placeholder="What should I do? e.g. find the cheapest 65&quot; OLED on prisjakt.nu" autofocus />
  <button id="go">Run</button>
  <button id="pause" class="ghost">Pause</button>
  <button id="stop" class="ghost">Stop</button>
</header>

<main>
  <div id="stage"><div class="empty">no screenshot yet — give it a goal</div></div>
  <aside>
    <div id="meta">
      <span class="pill" id="p-conn">connecting…</span>
      <span class="pill" id="p-decider">decider ?</span>
      <span class="pill" id="p-llm">llm ?</span>
      <div id="p-url" style="margin-top:6px"></div>
    </div>
    <div id="feed"></div>
    <div id="ask">
      <p id="question"></p>
      <div class="inline">
        <input id="answer" placeholder="your answer…" />
        <button id="send">Send</button>
      </div>
    </div>
  </aside>
</main>
<footer id="foot">idle</footer>

<script>
const params = new URLSearchParams(location.search);
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'
            + (params.get('token') ? '?token=' + encodeURIComponent(params.get('token')) : '');

const $ = (id) => document.getElementById(id);
const feed = $('feed'), stage = $('stage');
let socket, retry = 0;

function add(kind, title, sub, ratio) {
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  const bar = ratio === undefined ? '' :
    `<div class="bar"><span style="width:${Math.round(ratio * 100)}%"></span></div>`;
  row.innerHTML = `<div class="tag">${kind}</div><div class="body">${esc(title)}
    ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}${bar}</div>`;
  feed.appendChild(row);
  while (feed.childNodes.length > 300) feed.removeChild(feed.firstChild);
  feed.scrollTop = feed.scrollHeight;
}
const esc = (s) => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function connect() {
  socket = new WebSocket(wsUrl);
  socket.onopen = () => { retry = 0; $('p-conn').textContent = 'connected'; };
  socket.onclose = () => {
    $('p-conn').textContent = 'disconnected';
    setTimeout(connect, Math.min(5000, 400 * ++retry));
  };
  socket.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'backlog') { (msg.events || []).forEach(handle); return; }
    handle(msg);
  };
}

function handle(e) {
  switch (e.type) {
    case 'status':
      $('p-decider').textContent = 'decider: ' + e.decider;
      $('p-llm').textContent = 'llm: ' + e.llm + (e.llm_ready ? '' : ' ⚠');
      if (e.degraded_from) add('bad', 'Fast decider unavailable', e.degraded_from.join(': '));
      if (!e.llm_ready) add('bad', 'LLM not ready', e.llm_message);
      break;
    case 'run_start': add('user', 'GOAL: ' + e.goal); $('foot').textContent = 'running…'; break;
    case 'observation':
      $('p-url').textContent = e.title ? e.title + ' — ' + e.url : e.url;
      if (e.screenshot) stage.innerHTML = `<img alt="page" src="${e.screenshot}">`;
      $('foot').textContent = `step ${e.step} · ${e.candidates.length} candidates`;
      break;
    case 'verdict':
      add('laya', `${e.target} · p ${pct(e.p_top)} (+${pct(e.margin)}) · ${e.operation}`,
          `${e.latency_ms}ms · done ${pct(e.done_p)} · risky ${pct(e.risky_p)}`, e.p_top);
      break;
    case 'thinking': add('llm', 'escalated to LLM', e.note); break;
    case 'llm': add('llm', `${e.op}${e.element_idx != null ? ' → [' + e.element_idx + ']' : ''}`, e.reason || e.text); break;
    case 'acted': add(e.source === 'laya' ? 'laya' : e.source === 'llm' ? 'llm' : 'user', e.action, e.outcome); break;
    case 'question': showAsk(e.question); break;
    case 'answer': hideAsk(); add('user', 'you: ' + e.answer); break;
    case 'blocked': add('bad', 'blocked by policy', e.reason); break;
    case 'paused': $('foot').textContent = e.value ? 'paused' : 'running…'; break;
    case 'error': add('bad', e.message); break;
    case 'log': add('user', e.message); break;
    case 'run_end':
      add(e.status === 'done' ? 'user' : 'bad', 'FINISHED: ' + e.status, e.summary);
      $('foot').textContent = e.status + ' — ' + (e.summary || '');
      break;
  }
}
const pct = (v) => Math.round((v || 0) * 100) + '%';

function showAsk(q) { $('question').textContent = q; $('ask').classList.add('show'); $('answer').focus(); }
function hideAsk() { $('ask').classList.remove('show'); $('answer').value = ''; }

const send = (obj) => socket && socket.readyState === 1 && socket.send(JSON.stringify(obj));
$('go').onclick = () => { const g = $('goal').value.trim(); if (g) { feed.innerHTML = ''; send({ type: 'run', goal: g }); } };
$('goal').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('stop').onclick = () => send({ type: 'stop' });
let paused = false;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; send({ type: 'pause', value: paused }); };
$('send').onclick = () => { send({ type: 'answer', text: $('answer').value }); hideAsk(); };
$('answer').onkeydown = (e) => { if (e.key === 'Enter') $('send').click(); };

connect();
</script>
</body>
</html>
