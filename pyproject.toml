[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebot"
version = "0.1.0"
description = "Local-first browser agent: Laya for fast decisions, a small LLM for the hard ones, you for the rest."
readme = "README.md"
requires-python = ">=3.10"
# Tested on 3.11, 3.12 and 3.13 (3.13 including the real Laya weights).
# 3.10 runs the app but has not been exercised with torch. 3.14 is untested.
license = { text = "Apache-2.0" }
dependencies = [
    "playwright>=1.47",
    "fastapi>=0.115",
    # [standard] pulls the websockets implementation. The UI talks over a
    # WebSocket, so plain uvicorn serves the page and then refuses the upgrade.
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
laya = ["laya>=0.3.3"]

[project.scripts]
vibebot = "vibebot.__main__:main"

[tool.setuptools.packages.find]
include = ["vibebot*"]

[tool.setuptools.package-data]
vibebot = ["ui/*.html", "ui/*.css", "ui/*.js"]
